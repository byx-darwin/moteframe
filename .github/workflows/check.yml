name: portable-check
on: [push, pull_request]
permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare pinned Rust toolchain
        run: rustup show
      - name: Fetch locked dependencies before offline verification
        run: cargo fetch --locked
      - name: Portable host and Cortex-M33 regression
        run: make check build

  device-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare pinned Rust toolchain
        run: rustup show
      - name: Check FR8029D host and bare-metal build
        run: |
          cargo test --locked --manifest-path devices/Cargo.toml --workspace
          cargo test --locked --manifest-path devices/firmware/fr8029d-bringup/Cargo.toml --features ble-gatt-probe
          cargo test --locked --manifest-path devices/firmware/fr8029d-bringup/Cargo.toml --features ble-gatt-probe,ble-gatt-event-driven
          cargo build --locked --release --manifest-path devices/firmware/fr8029d-bringup/Cargo.toml --target thumbv8m.main-none-eabi --features ble-gatt-board --bin fr8029d-ble-adv
      - name: Check optional data length and the SDK GATT profile
        run: |
          cargo test --locked --manifest-path devices/Cargo.toml --workspace --all-features
          cargo test --locked --manifest-path devices/firmware/fr8029d-bringup/Cargo.toml --features ble-gatt-dle
          cargo test --locked --manifest-path devices/firmware/fr8029d-bringup/Cargo.toml --features ble-gatt-dle,ble-gatt-event-driven
          cargo build --locked --release --manifest-path devices/firmware/fr8029d-bringup/Cargo.toml --target thumbv8m.main-none-eabi --features ble-gatt-xip,ble-gatt-event-driven,ble-gatt-dle --bin fr8029d-ble-adv
          cargo build --locked --release --manifest-path devices/firmware/fr8029d-bringup/Cargo.toml --target thumbv8m.main-none-eabi --features ble-gatt-xip,ble-gatt-dle --bin fr8029d-ble-adv
      - name: Check FR8029D FreeRTOS build
        run: |
          git clone --depth 1 --branch V11.2.0 https://github.com/FreeRTOS/FreeRTOS-Kernel.git devices/target/fr8029d-freertos/kernel
          cargo build --locked --release --manifest-path devices/firmware/fr8029d-bringup/Cargo.toml --target thumbv8m.main-none-eabi --features ble-gatt-freertos,ble-gatt-xip --bin fr8029d-ble-adv
          cargo build --locked --release --manifest-path devices/firmware/fr8029d-bringup/Cargo.toml --target thumbv8m.main-none-eabi --features ble-gatt-freertos,ble-gatt-xip,ble-gatt-event-driven,ble-gatt-dle --bin fr8029d-ble-adv
          cargo build --locked --release --manifest-path devices/firmware/fr8029d-bringup/Cargo.toml --target thumbv8m.main-none-eabi --features ble-gatt-freertos,ble-gatt-xip,ble-gatt-dle --bin fr8029d-ble-adv
      - name: Test MIC1 scheduling and build both Flash images
        working-directory: devices/firmware/fr8029d-bringup
        run: |
          # Model the Flash task on the host without linking the ARM kernel.
          RUSTFLAGS='--cfg feature="ble-gatt-freertos" --cfg feature="ble-gatt-xip"' \
            cargo test --locked --features mic1-acquisition --test board_radio --test mic-session
          for features in mic1-config-layout-v1 mic1-config-layout-v1,ble-gatt-freertos; do
            cargo build --locked --release --target thumbv8m.main-none-eabi --bin fr8029d-ble-adv --features "$features"
          done
      - name: Test OTA and build both receivers with a matching target image
        working-directory: devices/firmware/fr8029d-bringup
        run: |
          cargo test --locked --features ota-v1,qspi-config,ble-gatt-event-driven
          for runtime in bare freertos; do
            extra=""
            if [ "$runtime" = freertos ]; then extra=",ble-gatt-freertos"; fi
            target=thumbv8m.main-none-eabi
            cargo build --locked --release --target "$target" --bin fr8029d-ble-adv --features "ble-gatt-xip-compact,ble-gatt-event-driven$extra"
            export FR29_OTA_IMAGE="$RUNNER_TEMP/$runtime-next.bin"
            PYTHONPATH=tools python3 - "target/$target/release/fr8029d-ble-adv" "$FR29_OTA_IMAGE" <<'PYTHON'
          from pathlib import Path
          import sys
          from gatt_notify_memory import inspect_image
          image = inspect_image(Path(sys.argv[1]).read_bytes(), xip=True)
          Path(sys.argv[2]).write_bytes(b"".join(data for _, data in image.loads))
          PYTHON
            cargo build --locked --release --target "$target" --bin fr8029d-ble-adv --features "ble-gatt-ota$extra"
          done
      - name: Validate event-driven SRAM images and interrupt vectors
        working-directory: devices/firmware/fr8029d-bringup
        run: |
          while read -r runtime identity; do
            cargo build --locked --release --target thumbv8m.main-none-eabi --features "$runtime,ble-gatt-event-driven" --bin fr8029d-ble-adv
            python3 tools/gatt_notify_memory.py pack target/thumbv8m.main-none-eabi/release/fr8029d-ble-adv "$RUNNER_TEMP/$runtime.tcl"
            grep -Fxq 'set notify_event_driven 1' "$RUNNER_TEMP/$runtime.tcl"
            grep -Fxq "set notify_identity $identity" "$RUNNER_TEMP/$runtime.tcl" || {
              echo "Expected $identity in the $runtime image" >&2
              exit 1
            }
          done <<'IMAGES'
          ble-gatt-board FR29-GAT2
          ble-gatt-freertos FR29-RTOS
          ble-gatt-freertos,ble-gatt-dle FR29-RTOS
          IMAGES
      - name: Test TouchKey and validate its firmware profiles
        working-directory: devices/firmware/fr8029d-bringup
        run: |
          cargo test --locked --lib --features touchkey-feedback touch_feedback
          touch_image() {
            cargo build --locked --release --target thumbv8m.main-none-eabi --bin fr8029d-ble-adv --features "touchkey-feedback,$1"
          }
          for features in ble-gatt-board,ble-gatt-mac-probe ble-gatt-freertos,ble-gatt-mac-probe; do
            touch_image "$features"
            python3 tools/gatt_notify_memory.py pack target/thumbv8m.main-none-eabi/release/fr8029d-ble-adv "$RUNNER_TEMP/touch-$features.tcl"
          done
          for features in ble-gatt-xip-compact ble-gatt-xip-compact,ble-gatt-freertos; do
            touch_image "$features"
          done
          reject_touch_image() {
            local log="$RUNNER_TEMP/touch-rejected.log"
            if touch_image "$1" >"$log" 2>&1; then
              echo "Unexpected success for touchkey-feedback,$1" >&2
              return 1
            fi
            grep -F "$2" "$log" || { cat "$log"; return 1; }
          }
          reject_touch_image ble-adv-probe 'requires the ble-gatt-board firmware entry'
          reject_touch_image ble-gatt-ota 'require separate firmware images'
          reject_touch_image ble-gatt-board,mic1-acquisition 'requires FreeRTOS Flash with short BLE packets'
          reject_touch_image mic1-config-layout-v1 'requires FreeRTOS Flash with short BLE packets'
          reject_touch_image ble-gatt-freertos,ble-gatt-dle 'requires a Flash image'
      - name: Test Flash recovery and SRAM acceptance tools offline
        working-directory: devices/firmware/fr8029d-bringup/tools
        run: |
          tclsh test_flash_trial.tcl
          python3 -m unittest discover

  mac-probe-regression:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Bluetooth acceptance tools offline
        run: |
          swift -D BLE_CONNECT_TESTS devices/scripts/ble_connect.swift
          swift -D BLE_SDK_COMPAT_TESTS devices/scripts/ble_sdk_compat.swift
          swiftc devices/scripts/ble_mic1.swift -o "$RUNNER_TEMP/ble_mic1"
