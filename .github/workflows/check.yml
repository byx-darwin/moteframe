name: portable-check
on: [push, pull_request]
permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare pinned Rust toolchain
        run: rustup show
      - name: Fetch locked dependencies before offline verification
        run: cargo fetch --locked
      - name: Portable host and Cortex-M0 regression
        run: make check build
