[package]
name = "device-property-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
codecs = ["dep:device-configuration"]
content-codecs = ["codecs", "dep:device-content"]
time = ["codecs", "device-configuration/time"]
device = ["codecs", "device-configuration/device"]
profile = ["codecs", "device-configuration/profile"]
settings = ["codecs", "device-configuration/settings"]
reminders = ["codecs", "device-configuration/reminders"]
find = ["content-codecs", "device-configuration/find", "device-content/find"]
telemetry = ["codecs", "device-configuration/telemetry"]
extension = ["codecs", "device-configuration/extension"]
heart-rate = ["codecs", "device-configuration/heart-rate"]
sleep = ["codecs", "device-configuration/sleep"]
sport = ["codecs", "device-configuration/sport"]
activity = ["codecs", "device-configuration/activity"]
blood-pressure = ["codecs", "device-configuration/blood-pressure"]
oxygen = ["codecs", "device-configuration/oxygen"]
glucose = ["codecs", "device-configuration/glucose"]
temperature = ["codecs", "device-configuration/temperature"]
wellbeing = ["codecs", "device-configuration/wellbeing"]
womens-health = ["codecs", "device-configuration/womens-health"]
uv = ["codecs", "device-configuration/uv"]
antplus = ["codecs", "device-configuration/antplus"]
radiation = ["codecs", "device-configuration/radiation"]
engineering = ["codecs", "device-configuration/engineering"]
phone = ["content-codecs", "device-configuration/external-content", "device-content/phone"]
companion-radio = ["content-codecs", "device-configuration/external-content", "device-content/companion-radio"]
notifications = ["content-codecs", "device-configuration/external-content", "device-content/notifications"]
watchface = ["content-codecs", "device-configuration/external-content", "device-content/watchface"]

[dependencies]
device-storage.workspace = true
device-services.workspace = true
device-protocol = { path = "../device-protocol", version = "=0.1.0" }
device-configuration = { path = "../device-configuration", version = "=0.1.0", default-features = false, optional = true }
device-content = { path = "../device-content", version = "=0.1.0", default-features = false, optional = true }

[lints]
workspace = true

[dev-dependencies]
device-connection = { path = "../device-connection", version = "=0.1.0" }
