[package]
name = "device-wellness-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false

[workspace]
resolver = "3"

[dependencies]
device-protocol = { version = "=0.1.0", path = "../device-protocol" }
device-services = { version = "=0.1.0", path = "../device-services", default-features = false }
device-wellness = { version = "=0.1.0", path = "../device-wellness", default-features = false }

[features]
default = []
rri = ["device-wellness/rri"]
uv = ["device-wellness/uv"]
womens-health = ["device-wellness/womens-health"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"
