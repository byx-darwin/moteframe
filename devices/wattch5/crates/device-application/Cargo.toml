[package]
name = "device-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
device-connection = { version = "=0.1.0", path = "../device-connection", default-features = false }
device-motion = { version = "=0.1.0", path = "../device-motion", default-features = false, optional = true }
device-wellness = { version = "=0.1.0", path = "../device-wellness", default-features = false, optional = true }
device-maintenance = { version = "=0.1.0", path = "../device-maintenance", default-features = false, optional = true }
device-health = { version = "=0.1.0", path = "../device-health", default-features = false, optional = true }
device-actions = { version = "=0.1.0", path = "../device-actions", default-features = false, optional = true }
device-history-service = { version = "=0.1.0", path = "../device-history-service", default-features = false, optional = true }
device-content = { version = "=0.1.0", path = "../device-content", default-features = false, optional = true }
device-protocol = { version = "=0.1.0", path = "../device-protocol", default-features = false }
device-services = { version = "=0.1.0", path = "../device-services", default-features = false }
device-storage = { version = "=0.1.0", path = "../device-storage", default-features = false }
device-configuration = { version = "=0.1.0", path = "../device-configuration", default-features = false, optional = true }

device-health-service = { version = "=0.1.0", path = "../device-health-service", default-features = false, optional = true }

device-motion-service = { version = "=0.1.0", path = "../device-motion-service", default-features = false, optional = true }

device-content-service = { version = "=0.1.0", path = "../device-content-service", default-features = false, optional = true }

device-wellness-service = { version = "=0.1.0", path = "../device-wellness-service", default-features = false, optional = true }

device-maintenance-service = { version = "=0.1.0", path = "../device-maintenance-service", default-features = false, optional = true }

device-object-service = { version = "=0.1.0", path = "../device-object-service", default-features = false, optional = true }

device-models = { version = "=0.1.0", path = "../device-models", default-features = false, optional = true }

[features]
default = []
service-routing = ["dep:device-health-service", "dep:device-motion-service", "dep:device-content-service", "device-content-service/event-pump", "dep:device-wellness-service", "dep:device-maintenance-service"]
objects = ["dep:device-object-service"]
device-jobs = ["dep:device-maintenance-service", "device-maintenance-service/device-jobs"]
system = ["dep:device-actions", "device-actions/system"]
history = ["dep:device-history-service"]
raw-data = ["device-services/raw-data", "device-protocol/raw-data", "device-maintenance-service?/raw-data"]
configuration = ["dep:device-configuration"]
device = ["configuration", "device-configuration/device", "dep:device-models", "device-models/device"]
time = ["configuration", "device-configuration/time"]
profile = ["configuration", "device-configuration/profile"]
settings = ["configuration", "device-configuration/settings"]
reminders = ["configuration", "device-configuration/reminders"]
find = ["configuration", "device-configuration/find", "dep:device-content", "device-content/find", "device-content-service?/find"]
telemetry = ["configuration", "device-configuration/telemetry"]
extension = ["configuration", "device-configuration/extension"]
health-policy = ["configuration", "device-configuration/health-policy"]
sleep = ["configuration", "device-configuration/sleep", "device-motion-service?/sleep"]
sport = ["configuration", "device-configuration/sport", "device-motion-service?/sport"]
activity = ["configuration", "device-configuration/activity", "device-motion-service?/activity"]
womens-health = ["configuration", "device-configuration/womens-health", "device-wellness-service?/womens-health"]
uv = ["configuration", "device-configuration/uv", "device-wellness-service?/uv"]
hid = ["configuration", "device-configuration/hid"]
antplus = ["configuration", "device-configuration/antplus"]
radiation = ["configuration", "device-configuration/radiation"]
engineering = ["configuration", "device-configuration/engineering", "dep:device-maintenance", "device-maintenance/engineering", "device-maintenance-service?/engineering"]
external-content = ["configuration", "device-configuration/external-content"]
limits = ["configuration", "device-configuration/limits"]

phone = ["external-content", "dep:device-content", "device-content/phone", "device-content-service?/phone"]

companion-radio = ["external-content", "dep:device-content", "device-content/companion-radio", "device-content-service?/companion-radio"]

notifications = ["external-content", "dep:device-content", "device-content/notifications", "device-content-service?/notifications"]

watchface = ["external-content", "dep:device-content", "device-content/watchface"]

weather = ["external-content", "dep:device-content", "device-content/weather"]

contacts = ["external-content", "dep:device-content", "device-content/contacts"]

wallet = ["external-content", "dep:device-content", "device-content/wallet"]

memo = ["external-content", "dep:device-content", "device-content/memo"]

heart-rate = ["dep:device-health", "device-health/heart-rate", "configuration", "device-configuration/heart-rate", "device-health-service?/heart-rate"]
blood-pressure = ["dep:device-health", "device-health/blood-pressure", "configuration", "device-configuration/blood-pressure", "device-health-service?/blood-pressure"]
oxygen = ["dep:device-health", "device-health/oxygen", "configuration", "device-configuration/oxygen", "device-health-service?/oxygen"]
glucose = ["dep:device-health", "device-health/glucose", "configuration", "device-configuration/glucose", "device-health-service?/glucose"]
temperature = ["dep:device-health", "device-health/temperature", "configuration", "device-configuration/temperature", "device-health-service?/temperature"]
ecg = ["dep:device-health", "device-health/ecg", "device-health-service?/ecg"]
wellbeing = ["dep:device-health", "device-health/wellbeing", "configuration", "device-configuration/wellbeing", "device-health-service?/wellbeing"]
microcirculation = ["dep:device-health", "device-health/microcirculation", "device-health-service?/microcirculation"]
media = ["dep:device-content", "device-content/media", "device-content-service?/media"]
gimbal = ["dep:device-content", "device-content/gimbal", "device-content-service?/gimbal"]
wear = ["dep:device-motion", "device-motion/wear", "device-motion-service?/wear"]
rri = ["dep:device-wellness", "device-wellness/rri", "device-wellness-service?/rri"]
self-test = ["dep:device-maintenance", "device-maintenance/self-test", "device-maintenance-service?/self-test"]
factory-config = ["dep:device-maintenance", "device-maintenance/factory-config", "device-maintenance-service?/factory-config"]
[lints]
workspace = true
