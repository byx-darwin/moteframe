[package]
name="device-health-service"
version="0.1.0"
edition="2024"
rust-version="1.96.0"
publish=false
[workspace]
[features]
default=[]
heart-rate=["device-health/heart-rate"]
blood-pressure=["device-health/blood-pressure"]
oxygen=["device-health/oxygen"]
glucose=["device-health/glucose"]
temperature=["device-health/temperature"]
ecg=["device-health/ecg"]
wellbeing=["device-health/wellbeing"]
microcirculation=["device-health/microcirculation"]
[dependencies]
device-health={ version = "=0.1.0",path="../device-health",default-features=false}
device-protocol={ version = "=0.1.0",path="../device-protocol",default-features=false}
device-services={ version = "=0.1.0",path="../device-services",default-features=false}
[lints.rust]
unsafe_code="forbid"
[lints.clippy]
pedantic={level="deny",priority=-1}
unwrap_used="deny"
expect_used="deny"
