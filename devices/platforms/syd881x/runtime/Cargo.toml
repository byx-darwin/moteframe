[package]
name = "syd881x-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[features]
default = []
hardware = ["dep:syd881x-hal", "syd881x-hal/hardware"]
trouble-runtime = ["hardware", "dep:critical-section", "dep:embassy-time-driver"]
lab-external-systick = ["trouble-runtime"]
[target.'cfg(target_arch = "arm")'.dependencies]
syd881x-hal = { workspace = true, optional = true }
critical-section = { workspace = true, optional = true, features = ["restore-state-bool"] }
embassy-time-driver = { workspace = true, optional = true }
[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
