[package]
name = "ble-host-trouble"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
extended-mtu = ["dep:embassy-sync", "dep:static_cell"]

[dependencies]
embassy-sync = { workspace = true, optional = true }
static_cell = { version = "=2.1.1", optional = true }
ble-controller.workspace = true
trouble-host.workspace = true
# Use the board critical-section implementation on targets without CAS.
portable-atomic.workspace = true

[dev-dependencies]
embassy-sync.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-8"] }
critical-section = { workspace = true, features = ["std"] }

[lints]
workspace = true
