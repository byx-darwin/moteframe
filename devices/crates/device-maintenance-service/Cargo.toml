[package]
name="device-maintenance-service"
version="0.1.0"
edition="2024"
rust-version="1.96.0"
publish=false
[workspace]
[features]
default=[]
raw-data=["dep:device-maintenance","device-maintenance/raw-data","device-protocol/raw-data","device-services/raw-data"]
self-test=["dep:device-maintenance","device-maintenance/self-test"]
engineering=["dep:device-maintenance","device-maintenance/engineering"]
factory-config=["dep:device-maintenance","device-maintenance/factory-config"]
device-jobs=[]
[dependencies]
device-protocol={ version = "=0.1.0",path="../device-protocol",default-features=false}
device-connection={ version = "=0.1.0",path="../device-connection",default-features=false}
device-services={ version = "=0.1.0",path="../device-services",default-features=false}
device-maintenance={ version = "=0.1.0",path="../device-maintenance",default-features=false,optional=true}
[lints.rust]
unsafe_code="forbid"
[lints.clippy]
pedantic={level="deny",priority=-1}
unwrap_used="deny"
expect_used="deny"
