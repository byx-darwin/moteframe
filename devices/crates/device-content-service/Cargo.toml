[package]
name = "device-content-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false

[workspace]

[features]
default = []
event-pump = ["dep:device-connection"]
phone = ["device-content/phone"]
media = ["device-content/media"]
find = ["device-content/find"]
notifications = ["device-content/notifications"]
companion-radio = ["device-content/companion-radio"]
gimbal = ["device-content/gimbal"]

[dependencies]
device-connection = { version = "=0.1.0", path = "../device-connection", default-features = false, optional = true }
device-content = { version = "=0.1.0", path = "../device-content", default-features = false }
device-protocol = { version = "=0.1.0", path = "../device-protocol", default-features = false }
device-services = { version = "=0.1.0", path = "../device-services", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"
