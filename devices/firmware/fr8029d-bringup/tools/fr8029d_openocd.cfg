# Debug transport for the FR8029D bench board. This sets up SWD only.
noinit
source [find interface/jlink.cfg]
transport select swd
adapter speed 1000
reset_config none
gdb_port disabled
tcl_port disabled
telnet_port disabled
swd newdap fr802x cpu -ignore-version
dap create fr802x.dap -chain-position fr802x.cpu
target create fr802x.cpu cortex_m -dap fr802x.dap -ap-num 0
fr802x.cpu cortex_m reset_config sysresetreq
init
