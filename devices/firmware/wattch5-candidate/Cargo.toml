[package]
name = "wattch5-candidate"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false
build = "build.rs"
[workspace]
[features]
default = []
development = []
arm-image = []
native-health = ["wattch5-product/legacy-health", "dep:device-health-service", "device-health/blood-pressure", "device-health/oxygen", "device-health/glucose"]
lab-stack-observer = ["syd881x-runtime/lab-external-systick"]
factory-ui = []
[dependencies]
moteframe-ble = { path = "../../../crates/moteframe-ble", version = "=0.2.0", default-features = false }
device-moteframe = { path = "../../wattch5/crates/device-moteframe", version = "=0.1.0" }
moteframe-core = { path = "../../../crates/moteframe-core", version = "=0.2.0", default-features = false }
moteframe-display = { path = "../../../crates/moteframe-display", version = "=0.2.0", default-features = false }
moteframe-ui = { path = "../../../crates/moteframe-ui", version = "=0.2.0", default-features = false, features = ["refresh"] }
device-configuration = { path = "../../wattch5/crates/device-configuration", version = "=0.1.0", features = ["settings"] }
wattch5-parity-ui-demo = { path = "../../examples/wattch5-parity-ui", version = "=0.1.0" }
wattch5-bringup = { path = "../wattch5-bringup", version = "=0.1.0" }
device-storage = { path = "../../wattch5/crates/device-storage", version = "=0.1.0" }
device-property-store = { path = "../../wattch5/crates/device-property-store", version = "=0.1.0" }
device-history-store = { path = "../../wattch5/crates/device-history-store", version = "=0.1.0" }
device-history-service = { path = "../../wattch5/crates/device-history-service", version = "=0.1.0" }
device-application = { path = "../../wattch5/crates/device-application", version = "=0.1.0", features = ["history"] }
device-connection = { path = "../../wattch5/crates/device-connection", version = "=0.1.0" }
device-spi-nor = { path = "../../drivers/spi-nor", version = "=0.1.0", features = ["experimental-candidate"] }
device-motion = { path = "../../wattch5/crates/device-motion", version = "=0.1.0", features = ["sleep", "activity", "sport"] }
device-health-service = { path = "../../wattch5/crates/device-health-service", version = "=0.1.0", optional = true, features = ["blood-pressure", "oxygen", "glucose"] }
device-health = { path = "../../wattch5/crates/device-health", version = "=0.1.0", features = ["heart-rate", "temperature"] }
embedded-hal = { version = "=1.0.0" }

device-protocol = { path = "../../wattch5/crates/device-protocol", version = "=0.1.0" }
device-services = { path = "../../wattch5/crates/device-services", version = "=0.1.0" }
device-runtime = { path = "../../wattch5/crates/device-runtime", version = "=0.1.0" }
device-core = { path = "../../wattch5/crates/device-core", version = "=0.1.0" }
device-display = { path = "../../drivers/display", version = "=0.1.0" }
device-ui = { path = "../../wattch5/crates/device-ui", version = "=0.1.0" }
device-touch = { path = "../../drivers/touch", version = "=0.1.0" }
ble-controller = { path = "../../crates/ble-controller", version = "=0.1.0" }
ble-host-trouble = { path = "../../crates/ble-host-trouble", version = "=0.1.0" }
wattch5-product = { path = "../wattch5-product", version = "=0.1.0", default-features = false, features = ["development", "runtime-trouble"] }
embassy-time = { version = "=0.5.1", default-features = false }
embassy-sync = { version = "=0.8.0", default-features = false }
[target.'cfg(target_arch = "arm")'.dependencies]
bt-hci = { version = "=0.10.0", default-features = false }
board-syd8810 = { path = "../../boards/wattch5", version = "=0.1.0", features = ["native-radio", "trouble-runtime"] }
syd881x-runtime = { path = "../../platforms/syd881x/runtime", version = "=0.1.0", features = ["trouble-runtime"] }
ble-controller-syd881x = { path = "../../platforms/syd881x/controller", version = "=0.1.0" }
syd881x-radio = { path = "../../platforms/syd881x/radio", version = "=0.1.0" }
static_cell = { version = "=2.1.1", default-features = false }
embassy-time-driver = { version = "=0.2.2", default-features = false, features = ["tick-hz-1_000_000"] }
[dev-dependencies]
device-connection = { path = "../../wattch5/crates/device-connection", version = "=0.1.0" }
critical-section = { version = "=1.2.0", features = ["std"] }
embassy-time = { version = "=0.5.1", features = ["std", "generic-queue-8"] }
[[bin]]
name = "wattch5-candidate"
path = "src/main.rs"
test = false
bench = false
required-features = ["arm-image", "development"]
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
