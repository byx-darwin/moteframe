[workspace]
members = [
    "crates/device-moteframe",
    "platforms/syd881x/hal",
    "platforms/syd881x/runtime",
    "drivers/bitbang-i2c",
    "drivers/spi-nor",
    "drivers/touch",
    "drivers/resource-archive",

    "crates/device-application",
    "crates/device-stream",
    "crates/device-services",
    "crates/device-connection",
    "crates/device-motion",
    "crates/device-actions",
    "crates/device-models",
    "crates/device-storage",
    "crates/device-config-store",
    "crates/device-object-store",
    "crates/device-history-store",
    "crates/device-property-store",
    "crates/device-time-store",
    "crates/device-job-store",
    "crates/device-runtime",
    "crates/device-protocol",
    "crates/device-core",
    "crates/device-assets",
    "drivers/display",
    "crates/device-ble",
    "platforms/syd881x/vendor-ble",
    "boards/wattch5",
    "platforms/syd881x/radio",
    "crates/ble-controller",
    "crates/ble-host-trouble",
    "platforms/syd881x/controller",
    "crates/device-ui",
    "examples/wattch5-ui",
    "examples/wattch5-retro-ui",
    "examples/wattch5-parity-ui",
]
exclude = [
    "crates/device-health",
    "crates/device-maintenance",
    "crates/device-content",
    "crates/device-wellness",
    "crates/device-object-service",
    "crates/device-history-service",
    "crates/device-configuration",
    "crates/device-health-service",
    "crates/device-motion-service",
    "crates/device-content-service",
    "crates/device-maintenance-service",
    "crates/device-wellness-service",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false

[workspace.dependencies]
device-storage = { path = "crates/device-storage", version = "0.1.0" }
device-services = { path = "crates/device-services", version = "0.1.0" }
syd881x-hal = { path = "platforms/syd881x/hal", version = "0.1.0" }
syd881x-runtime = { path = "platforms/syd881x/runtime", version = "0.1.0" }
device-bitbang-i2c = { path = "drivers/bitbang-i2c", version = "0.1.0" }
device-spi-nor = { path = "drivers/spi-nor", version = "0.1.0" }
device-touch = { path = "drivers/touch", version = "0.1.0" }
device-resource-archive = { path = "drivers/resource-archive", version = "0.1.0" }

device-assets = { path = "crates/device-assets", version = "0.1.0" }
embedded-hal = { version = "=1.0.0", default-features = false }
device-core = { path = "crates/device-core", version = "0.1.0" }
device-ble = { path = "crates/device-ble", version = "0.1.0" }
syd881x-radio = { path = "platforms/syd881x/radio", version = "0.1.0" }

device-display = { path = "drivers/display", version = "0.1.0" }
device-ui = { path = "crates/device-ui", version = "0.1.0" }
embedded-graphics = { version = "=0.8.2", default-features = false }
bt-hci = { version = "=0.10.0", default-features = false }
embedded-io = { version = "=0.7.1", default-features = false }

ble-controller = { path = "crates/ble-controller", version = "0.1.0" }

trouble-host = { version = "=0.8.0", default-features = false, features = ["peripheral", "gatt", "default-packet-pool-size-4", "default-packet-pool-mtu-27", "connection-event-queue-size-4", "l2cap-rx-queue-size-2", "l2cap-tx-queue-size-2"] }
embassy-sync = { version = "=0.8.0", default-features = false }
embassy-time = { version = "=0.5.1", default-features = false }
critical-section = { version = "=1.2.0", default-features = false }

portable-atomic = { version = "=1.15.0", default-features = false, features = ["critical-section"] }

embassy-time-driver = { version = "=0.2.2", default-features = false, features = ["tick-hz-1_000_000"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
