<!doctype html><meta charset="utf-8"><title>wattch 5 · UI reference</title>
<style>body{margin:32px;background:#202124;color:#eee;font:16px system-ui}main{display:flex;gap:32px;align-items:start;flex-wrap:wrap}section{flex:1 1 280px;max-width:512px}img{width:min(512px,calc(100vw - 64px));height:auto;aspect-ratio:1;image-rendering:pixelated;touch-action:none;border:1px solid #555}button{font:inherit;margin:6px;padding:8px 14px}pre{white-space:pre-wrap;max-width:360px}</style>
<h1>wattch 5</h1><p>原厂外观回放 · 演示数据 · 不执行真实业务动作</p><main><img id="screen" src="/frame.bmp" draggable="false" alt="128×128 Rust reference UI"><section><p>鼠标拖动模拟滑动，点击模拟触摸。</p><p>方向键：滑动；空格：侧键松开；Esc：右滑返回。</p><button data-event="up">上滑</button><button data-event="down">下滑</button><br><button data-event="left">左滑</button><button data-event="right">右滑</button><br><button data-event="key">侧键</button><button data-event="press">长按屏幕</button><pre id="status">表盘：10:50。上滑打开功能菜单，再上滑找到设置。</pre></section></main>
<script>const screen=document.querySelector('#screen'),status=document.querySelector('#status');let queue=Promise.resolve();function send(event){queue=queue.then(async()=>{const r=await fetch('/event',{method:'POST',body:event});status.textContent=await r.text();screen.src='/frame.bmp?t='+Date.now()})}document.querySelectorAll('button').forEach(b=>b.onclick=()=>send(b.dataset.event));let start;screen.onpointerdown=e=>{screen.setPointerCapture(e.pointerId);start={x:e.clientX,y:e.clientY,t:Date.now()}};screen.onpointerup=e=>{if(!start)return;const r=screen.getBoundingClientRect(),dx=(e.clientX-start.x)*128/r.width,dy=(e.clientY-start.y)*128/r.height;if(Math.max(Math.abs(dx),Math.abs(dy))>=16)send(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');else if(Date.now()-start.t>700)send('press');else send('tap '+Math.floor((e.clientX-r.left)*128/r.width)+' '+Math.floor((e.clientY-r.top)*128/r.height));start=null};document.onkeydown=e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',' ':'key',Escape:'right'};if(m[e.key]){e.preventDefault();send(m[e.key])}};</script>
