<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>wattch 5 · Rust Parity V2</title>
<style>
:root{color-scheme:dark;background:#101a13;color:#e5eddf;font:16px/1.55 system-ui,sans-serif;accent-color:#b8e46b}body{max-width:1020px;margin:0 auto;padding:24px}h1{font-size:28px;line-height:1.15;margin:0 0 12px}p{max-width:68ch;color:#afc0a6}main{display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap}figure{margin:0;flex:0 1 512px;min-width:0}#screen{display:block;width:100%;max-width:512px;aspect-ratio:1;image-rendering:pixelated;touch-action:none;cursor:crosshair}figcaption{margin-top:12px;color:#afc0a6}.controls{flex:1 1 300px;min-width:0}fieldset{border:0;padding:0;margin:0 0 24px}legend{font-weight:650;margin-bottom:8px}button,select,input{font:inherit;background:#213222;color:#e5eddf;border:1px solid #6a8062;padding:8px 12px;min-height:44px;cursor:pointer}button:hover,select:hover{background:#30462c}button:active{background:#476036}button:focus-visible,select:focus-visible{outline:2px solid #b8e46b;outline-offset:3px}.buttons{display:flex;gap:8px;flex-wrap:wrap}label{display:block;margin:10px 0 4px}select{max-width:100%;width:100%}input{font:inherit;box-sizing:border-box;max-width:100%;min-height:44px;width:110px;padding:8px;background:#213222;color:#e5eddf;border:1px solid #6a8062}output{display:block;overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px;color:#c5d8b8}::selection{background:#b8e46b;color:#07130d}@media(max-width:600px){body{padding:16px}main{gap:24px}h1{font-size:24px}}
</style><h1>wattch 5</h1><p>Rust V2 · 原始 UI 功能对齐 · 默认中文 · 所有业务动作只发请求</p><main><figure><img id="screen" src="/frame.bmp" alt="128×128 Rust 手表界面，可点击和滑动"><figcaption>拖动模拟滑动，点击模拟触摸。方向键滑动，Enter 选择，空格模拟侧键，Esc 返回。</figcaption></figure><section class="controls" aria-label="演示控制">
<fieldset><legend>手表输入</legend><div class="buttons"><button data-event="up">上滑</button><button data-event="down">下滑</button><button data-event="left">左滑</button><button data-event="right">右滑</button><button data-event="select">选择</button><button data-event="key">侧键</button><button data-event="hold">长按屏幕</button><button data-event="keyhold">长按侧键</button></div></fieldset>
<fieldset><legend>演示定位</legend><label for="page">直接查看页面</label><select id="page"><option value="boot">启动 · boot</option><option value="dial" selected>表盘 · dial</option><option value="activity">计步 · activity</option><option value="sport">运动 · sport</option><option value="heart">心率 · heart</option><option value="pressure">血压 · pressure</option><option value="oxygen">血氧 · oxygen</option><option value="sleep">睡眠 · sleep</option><option value="alarm">闹钟注册项 · alarm</option><option value="stopwatch">秒表 · stopwatch</option><option value="findphone">查找手机 · findphone</option><option value="about">设备信息 · about</option><option value="power">关机确认 · power</option><option value="messages">消息 · messages</option><option value="weather">天气 · weather</option><option value="settings">设置 · settings</option><option value="ota">升级状态 · ota</option><option value="face">表盘选择 · face</option><option value="notification">通知入口 · notification</option><option value="tools">功能菜单 · tools</option><option value="quick">快捷菜单 · quick</option><option value="brightness">亮度 · brightness</option><option value="clear">清除数据 · clear</option><option value="timer">倒计时 · timer</option><option value="reset">重置注册项 · reset</option><option value="music">音乐控制 · music</option><option value="language">语言 · language</option><option value="temperature">体温 · temperature</option><option value="shutdown">关机画面 · shutdown</option><option value="restart">重启确认 · restart</option><option value="textsize">通知文字 · textsize</option><option value="charge">充电 · charge</option><option value="lock">锁屏确认 · lock</option><option value="unlock">解锁 · unlock</option><option value="applet">表盘下载状态 · applet</option><option value="glucose">血糖 · glucose</option><option value="hba1c">糖化血红蛋白 · hba1c</option><option value="call">来电 · call</option><option value="noticeApp">应用通知 · noticeApp</option><option value="noticeAlarm">闹钟提醒 · noticeAlarm</option><option value="noticeFind">查找手表 · noticeFind</option><option value="noticeDisconnect">断连注册项 · noticeDisconnect</option><option value="noticeMove">久坐提醒 · noticeMove</option><option value="noticeBattery">低电量 · noticeBattery</option><option value="camera">遥控拍照 · camera</option><option value="noticeTimer">倒计时结束 · noticeTimer</option><option value="noticeHeart">心率提醒 · noticeHeart</option><option value="timerCustom">自定义倒计时 · timerCustom</option><option value="timerRun">倒计时控制 · timerRun</option><option value="timerDone">倒计时结束页 · timerDone</option><option value="sportList">运动类型 · sportList</option><option value="sportCountdown">运动倒数 · sportCountdown</option><option value="sportRun">运动数据 · sportRun</option><option value="sportControls">运动控制 · sportControls</option><option value="sportEnd">运动结束确认 · sportEnd</option><option value="messageDetail">消息详情 · messageDetail</option><option value="deviceQr">配对二维码 · deviceQr</option><option value="measureTips">测量须知 · measureTips</option><option value="measureConfirm">测量确认 · measureConfirm</option><option value="theme">配色扩展 · theme</option><option value="format">时间制式扩展 · format</option><option value="request">外部请求反馈 · request</option></select><label for="time">固定时间快照</label><select id="time"><option value="10 50">10:50</option><option value="0 0">00:00</option><option value="12 0">12:00</option><option value="23 59">23:59</option></select><label for="locale">显示语言</label><select id="locale"><option value="zh">简体中文</option><option value="en">English</option></select><label for="theme">配色</label><select id="theme"><option value="0">PHOSPHOR</option><option value="1">AMBER</option><option value="2">ICE</option></select><label for="timer">倒计时数据状态</label><select id="timer"><option>IDLE</option><option>RUNNING</option><option>PAUSED</option><option>DONE</option><option>UNAVAILABLE</option></select><label for="stopwatch">秒表数据状态</label><select id="stopwatch"><option>IDLE</option><option>RUNNING</option><option selected>PAUSED</option><option>UNAVAILABLE</option></select></fieldset>
<fieldset><legend>测量快照注入 · 不是真实测量</legend><label for="kind">测量项目</label><select id="kind"><option value="heart">心率</option><option value="pressure">血压</option><option value="oxygen">血氧</option><option value="temperature">体温</option><option value="glucose">血糖</option><option value="hba1c">糖化血红蛋白</option></select><label for="measureState">外部测量状态</label><select id="measureState"><option value="idle">Idle · 未开始</option><option value="pending">Pending · 等待数据</option><option value="measuring">Measuring · 测量中</option><option value="result">Result · 测量结果</option><option value="error">Error · 测量失败</option><option value="unavailable">Unavailable · 暂不可用</option></select><label for="reading">固定演示读数（缺失用 --）</label><input id="reading" value="--" maxlength="7"><label for="high">心率历史最高 / 最低</label><div class="buttons"><input id="high" value="--" maxlength="3" aria-label="历史最高"><input id="low" value="--" maxlength="3" aria-label="历史最低"></div><button id="injectMeasure">注入快照</button></fieldset>
<fieldset><legend>其他外部快照</legend><div class="buttons"><button data-command="watch RUNNING 45678 twenty">秒表运行 · 20 条计次</button><button data-command="watch PAUSED 45678 twenty">秒表暂停</button><button data-command="messages empty">消息为空</button><button data-command="messages demo">两条演示消息</button><button data-command="weather -12 8 3">天气 · 雪 -12 / 8</button><button data-command="weather none">天气无数据</button><button data-command="sport COUNTDOWN 2 0 0 0 -- 0">运动倒数 2</button><button data-command="sport RUNNING 0 125 125 38 88 0">运动运行快照</button><button data-command="sport PAUSED 0 125 125 38 88 1">运动暂停并锁定</button><button data-command="sport DONE 0 125 125 38 88 0">运动结束快照</button><button data-command="timer DONE 0">倒计时结束快照</button></div></fieldset><fieldset><legend>请求与状态</legend><output id="log" aria-live="polite">默认中文 / STACK / PHOSPHOR / 24H。未连接设备，未执行业务动作。</output></fieldset></section></main>
<script>
const screen=document.querySelector('#screen'),log=document.querySelector('#log'),requests=[];
let queue=Promise.resolve();function send(event){queue=queue.then(()=>sendNow(event));return queue;}
async function sendNow(event){try{const response=await fetch('/event',{method:'POST',body:event});const text=await response.text();if(text.startsWith('Ok(Request(')){requests.push(text.split('\n')[0]);if(requests.length>12)requests.shift();}log.textContent=text+(requests.length?'\n\n最近 12 条请求：\n'+requests.join('\n'):'');const current=text.match(/screen=([A-Za-z0-9]+);/);if(current)document.querySelector('#page').value=current[1];const loc=text.match(/locale: (Zh|En)/);if(loc)document.querySelector('#locale').value=loc[1].toLowerCase();screen.src='/frame.bmp?'+Date.now();}catch(error){log.textContent='预览连接失败，请确认本地 Rust 预览进程仍在运行。';}}
document.querySelectorAll('[data-event]').forEach(button=>button.onclick=()=>send(button.dataset.event));
document.querySelector('#page').onchange=e=>send('view '+e.target.value);document.querySelector('#time').onchange=e=>send('time '+e.target.value);document.querySelector('#timer').onchange=e=>send('timer '+e.target.value+' 300');document.querySelector('#stopwatch').onchange=e=>send('watch '+e.target.value+' 1284 demo');
document.querySelector('#locale').onchange=e=>send('locale '+e.target.value);document.querySelector('#theme').onchange=e=>send('theme '+e.target.value);document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>send(b.dataset.command));document.querySelector('#injectMeasure').onclick=()=>send('measure '+['kind','measureState','reading','high','low'].map(id=>document.getElementById(id).value).join(' '));
const point=e=>{const r=screen.getBoundingClientRect();return{x:Math.max(0,Math.min(127,Math.floor((e.clientX-r.left)*128/r.width))),y:Math.max(0,Math.min(127,Math.floor((e.clientY-r.top)*128/r.height)))}};let begin;
screen.onpointerdown=e=>{screen.setPointerCapture(e.pointerId);begin={...point(e),t:performance.now()};};screen.onpointerup=e=>{if(!begin)return;const end=point(e),dx=end.x-begin.x,dy=end.y-begin.y;const event=Math.max(Math.abs(dx),Math.abs(dy))>=18?(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')):(performance.now()-begin.t>=600?'hold':'tap '+end.x+' '+end.y);begin=null;send(event);};screen.onpointercancel=()=>begin=null;
document.onkeydown=e=>{if(e.target.matches('select,button,input'))return;const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'select',' ':'key',Escape:'right'};if(keys[e.key]){e.preventDefault();send(keys[e.key]);}};
</script></html>
