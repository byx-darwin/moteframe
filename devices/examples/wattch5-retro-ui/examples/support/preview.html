<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>wattch 5 · Rust Retro</title>
<style>
:root{color-scheme:dark;background:#101a13;color:#e5eddf;font:16px/1.55 system-ui,sans-serif;accent-color:#b8e46b}body{max-width:1020px;margin:0 auto;padding:24px}h1{font-size:28px;line-height:1.15;margin:0 0 12px}p{max-width:68ch;color:#afc0a6}main{display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap}figure{margin:0;flex:0 1 512px;min-width:0}#screen{display:block;width:100%;max-width:512px;aspect-ratio:1;image-rendering:pixelated;touch-action:none;cursor:crosshair}figcaption{margin-top:12px;color:#afc0a6}.controls{flex:1 1 300px;min-width:0}fieldset{border:0;padding:0;margin:0 0 24px}legend{font-weight:650;margin-bottom:8px}button,select{font:inherit;background:#213222;color:#e5eddf;border:1px solid #6a8062;padding:8px 12px;min-height:44px;cursor:pointer}button:hover,select:hover{background:#30462c}button:active{background:#476036}button:focus-visible,select:focus-visible{outline:2px solid #b8e46b;outline-offset:3px}.buttons{display:flex;gap:8px;flex-wrap:wrap}label{display:block;margin:10px 0 4px}select{max-width:100%;width:100%}output{display:block;overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px;color:#c5d8b8}::selection{background:#b8e46b;color:#07130d}@media(max-width:600px){body{padding:16px}main{gap:24px}h1{font-size:24px}}
</style><h1>wattch 5</h1><p>Rust 复古数码界面 · 演示快照 · 请求只记入下方日志</p><main><figure><img id="screen" src="/frame.bmp" alt="128×128 Rust 手表界面，可点击和滑动"><figcaption>拖动模拟滑动，点击模拟触摸。方向键滑动，Enter 选择，空格模拟侧键，Esc 返回。</figcaption></figure><section class="controls" aria-label="演示控制">
<fieldset><legend>手表输入</legend><div class="buttons"><button data-event="up">上滑</button><button data-event="down">下滑</button><button data-event="left">左滑</button><button data-event="right">右滑</button><button data-event="select">选择</button><button data-event="key">侧键</button><button data-event="hold">长按屏幕</button><button data-event="keyhold">长按侧键</button></div></fieldset>
<fieldset><legend>演示定位</legend><label for="page">直接查看页面</label><select id="page"><option value="dial">表盘</option><option value="tools">工具菜单</option><option value="quick">快捷设置</option><option value="settings">设置</option><option value="display">显示设置</option><option value="brightness">亮度</option><option value="face">表盘选择</option><option value="theme">配色</option><option value="format">时间制式</option><option value="about">关于</option><option value="timer">倒计时演示</option><option value="stopwatch">秒表演示</option><option value="system">系统请求</option><option value="confirm">请求确认</option><option value="request">请求反馈</option></select><label for="time">固定时间快照</label><select id="time"><option value="10 50">10:50</option><option value="0 0">00:00</option><option value="12 0">12:00</option><option value="23 59">23:59</option></select><label for="timer">倒计时数据状态</label><select id="timer"><option>IDLE</option><option>RUNNING</option><option>PAUSED</option><option>DONE</option><option>UNAVAILABLE</option></select><label for="stopwatch">秒表数据状态</label><select id="stopwatch"><option>IDLE</option><option>RUNNING</option><option selected>PAUSED</option><option>UNAVAILABLE</option></select></fieldset>
<fieldset><legend>请求与状态</legend><output id="log" aria-live="polite">默认 STACK / PHOSPHOR / 24H。未连接设备，未执行业务动作。</output></fieldset></section></main>
<script>
const screen=document.querySelector('#screen'),log=document.querySelector('#log'),requests=[];
async function send(event){try{const response=await fetch('/event',{method:'POST',body:event});const text=await response.text();if(text.startsWith('Ok(Request(')){requests.push(text.split('\n')[0]);if(requests.length>12)requests.shift();}log.textContent=text+(requests.length?'\n\n最近 12 条请求：\n'+requests.join('\n'):'');const current=text.match(/screen=([A-Za-z]+);/);if(current)document.querySelector('#page').value=current[1].toLowerCase();screen.src='/frame.bmp?'+Date.now();}catch(error){log.textContent='预览连接失败，请确认本地 Rust 预览进程仍在运行。';}}
document.querySelectorAll('[data-event]').forEach(button=>button.onclick=()=>send(button.dataset.event));
document.querySelector('#page').onchange=e=>send('view '+e.target.value);document.querySelector('#time').onchange=e=>send('time '+e.target.value);document.querySelector('#timer').onchange=e=>send('timer '+e.target.value);document.querySelector('#stopwatch').onchange=e=>send('stopwatch '+e.target.value);
const point=e=>{const r=screen.getBoundingClientRect();return{x:Math.max(0,Math.min(127,Math.floor((e.clientX-r.left)*128/r.width))),y:Math.max(0,Math.min(127,Math.floor((e.clientY-r.top)*128/r.height)))}};let begin;
screen.onpointerdown=e=>{screen.setPointerCapture(e.pointerId);begin={...point(e),t:performance.now()};};screen.onpointerup=e=>{if(!begin)return;const end=point(e),dx=end.x-begin.x,dy=end.y-begin.y;const event=Math.max(Math.abs(dx),Math.abs(dy))>=18?(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')):(performance.now()-begin.t>=600?'hold':'tap '+end.x+' '+end.y);begin=null;send(event);};screen.onpointercancel=()=>begin=null;
document.onkeydown=e=>{if(e.target.matches('select,button,input'))return;const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'select',' ':'key',Escape:'right'};if(keys[e.key]){e.preventDefault();send(keys[e.key]);}};
</script></html>
