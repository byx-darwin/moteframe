[workspace]
members = [
    "crates/moteframe-core",
    "crates/moteframe-display",
    "crates/moteframe-ui",
    "crates/moteframe-i2c",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
repository = "https://github.com/byx-darwin/moteframe"
publish = false

[workspace.dependencies]
moteframe-core = { path = "crates/moteframe-core", version = "=0.1.0" }
moteframe-display = { path = "crates/moteframe-display", version = "=0.1.0" }
embedded-hal = { version = "=1.0.0", default-features = false }
embedded-graphics = { version = "=0.8.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
