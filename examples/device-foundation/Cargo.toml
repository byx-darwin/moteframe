[package]
name = "moteframe-device-foundation"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[features]
default = []
small-memory = []

[dependencies]
moteframe-core = { path = "../../crates/moteframe-core", version = "=0.2.0", default-features = false }
moteframe-ui = { path = "../../crates/moteframe-ui", version = "=0.2.0", default-features = false, features = ["refresh", "frame-pacing"] }
moteframe-assets = { path = "../../crates/moteframe-assets", version = "=0.2.0", default-features = false }
moteframe-storage = { path = "../../crates/moteframe-storage", version = "=0.2.0", default-features = false }
moteframe-input = { path = "../../crates/moteframe-input", version = "=0.2.0", default-features = false }
moteframe-ble = { path = "../../crates/moteframe-ble", version = "=0.2.0", default-features = false }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
