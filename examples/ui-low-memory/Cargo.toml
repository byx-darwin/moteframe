[package]
name = "moteframe-ui-low-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
publish = false

# This is a firmware-consumer example, independent of the library workspace.
[workspace]
resolver = "3"

[features]
default = []
ui-low-memory = []

[dependencies]
moteframe-core = { path = "../../crates/moteframe-core", version = "=0.2.0", default-features = false }
moteframe-ui = { path = "../../crates/moteframe-ui", version = "=0.2.0", default-features = false, features = ["refresh"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
